<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal API</title>
    <style>
      body {
        background-color: #182b4c;

        margin: 0;
        /*100vh height occupies full page height*/
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      label {
        color: white;
      }

      button {
        /*
        block converts the button into an independent 
        "box" allowing it to occupy a full line
        */
        display: block;
        margin: 0 auto;
      }

      h1,
      h2 {
        text-align: center;
        color: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <h2>Create a task</h2>

      <!--
    <form> represents a document section that contains
    a fields group that user completes to submit/send info
    -->
      <form id="task-form">
        <div class="field-group">
          <!--
        'for' and 'id' being the same allows the user to click on the label
        -->
          <label for="name">Name</label>
          <input type="text" id="name" name="task_name" />
        </div>

        <div class="field-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="task_description" />
        </div>

        <div class="field-group">
          <label for="completed">Completed</label>
          <input type="checkbox" id="completed" name="task_status" />
        </div>

        <button id="create-task" type="submit">Create</button>

        <dialog id="message-dialog">
          <h3>Message</h3>
          <p id="message-text"></p>
          <button id="bttn-close" type="button">Close</button>
        </dialog>
      </form>

      <script>
        const API_URL = "http://127.0.0.1:8000";
        const dialog = document.getElementById("message-dialog");
        const bttn_close = document.getElementById("bttn-close");
        const dialog_message = document.getElementById("message-text");

        bttn_close.addEventListener("click", () => {
          dialog.close();
        });

        document
          .getElementById("task-form")
          .addEventListener("submit", async (event) => {
            event.preventDefault();

            const form = {
              name: document.getElementById("name").value,
              description: document.getElementById("description").value,
              completed: document.getElementById("completed").checked,
            };

            try {
              const response = await fetch(`${API_URL}/tasks/`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(form),
              });

              if (!response.ok) {
                const error = await response.json();
                throw new Error(JSON.stringify(error));
              }

              dialog_message.textContent = "Task created successfully.";
              dialog.showModal();
            } catch (error) {
              dialog_message.textContent = "Error while sending data.";
              dialog.showModal();
            }
          });
      </script>
    </main>
  </body>
</html>
